<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Studio Adrielle Ferreira Pilates</title>
    <meta
      name="description"
      content="Studio Adrielle Ferreira: pilates e fisioterapia em São João de Meriti, RJ. Agende sua aula experimental."
    />
    <link rel="canonical" href="https://studio-adrielle-pilates.pages.dev/" />

    <!--
      Crawlers de redes sociais não executam JS: estas tags e o JSON-LD
      precisam ficar estáticos aqui, não gerados via React. Ao atualizar
      src/data/studio.ts (nome, descrição, endereço, telefone, URL do site),
      atualize também os valores abaixo manualmente.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Studio Adrielle Ferreira Pilates" />
    <meta
      property="og:description"
      content="Studio Adrielle Ferreira: pilates e fisioterapia em São João de Meriti, RJ. Agende sua aula experimental."
    />
    <meta
      property="og:url"
      content="https://studio-adrielle-pilates.pages.dev/"
    />
    <meta
      property="og:image"
      content="https://studio-adrielle-pilates.pages.dev/og-image.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Studio Adrielle Ferreira Pilates" />
    <meta
      name="twitter:description"
      content="Studio Adrielle Ferreira: pilates e fisioterapia em São João de Meriti, RJ. Agende sua aula experimental."
    />
    <meta
      name="twitter:image"
      content="https://studio-adrielle-pilates.pages.dev/og-image.jpg"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthClub",
        "name": "Studio Adrielle Ferreira",
        "description": "Estúdio de pilates e fisioterapia em São João de Meriti, RJ.",
        "image": "https://studio-adrielle-pilates.pages.dev/og-image.jpg",
        "url": "https://studio-adrielle-pilates.pages.dev/",
        "telephone": "+5521965321409",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "R. Panamense, 2 - Quadra 35",
          "addressLocality": "São João de Meriti",
          "addressRegion": "RJ",
          "postalCode": "25555-740",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday"
            ],
            "opens": "07:00",
            "closes": "21:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/studioadrielleferreirapilates/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
